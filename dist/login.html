<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Tom | Login</title>
    <script type="module" crossorigin src="/assets/login-Cy_loaK9.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/auth-nav-BisOj3S9.js">
    <link rel="stylesheet" crossorigin href="/assets/styles-CPYS1tjY.css">
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="Go to Smart Tom home">
          <div class="brand-badge">S</div>
          Smart Tom
        </a>

        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="orders.html">Orders</a>
          <a href="profile.html" data-auth-only="profile" hidden>Profile</a>
          <button class="btn secondary" data-auth-toggle type="button">Login</button>
        </nav>
      </header>

      <main class="section">
        <div class="login-shell">
          <div class="card panel">
            <h2>Welcome back</h2>
            <form id="loginForm">
              <label>
                Email
                <input type="email" name="email" placeholder="student@school.edu" required />
              </label>

              <label>
                Password
                <input type="password" name="password" placeholder="Enter your password" required />
              </label>

              <button type="submit" class="btn">Login</button>
            </form>
            <div id="authMessage" class="status"></div>
          </div>

          <div class="card panel">
            <h2>Create student account</h2>
            <form id="signupForm">
              <label>
                Full name
                <input type="text" name="fullName" placeholder="Enter your full name" required />
              </label>

              <label>
                Email
                <input type="email" name="email" placeholder="student@school.edu" required />
              </label>

              <label>
                Password
                <input type="password" name="password" placeholder="Create a strong password" required />
              </label>

              <button type="submit" class="btn secondary">Create account</button>
            </form>
            <div id="signupMessage" class="status"></div>
          </div>
        </div>
      </main>

      <footer class="footer">Smart Tom • Student service and pickup support</footer>
    </div>

  </body>
</html>
