<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Tom | Admin Products</title>
    <script type="module" crossorigin src="/assets/adminProducts-CUNjCrZY.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/auth-nav-BisOj3S9.js">
    <link rel="stylesheet" crossorigin href="/assets/styles-CPYS1tjY.css">
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <a class="brand" href="index.html"><div class="brand-badge">S</div>Smart Tom</a>
        <nav class="nav"><a href="admin.html">Admin home</a><a href="admin-products.html">Products</a><a href="admin-orders.html">Orders</a><button class="btn secondary" data-auth-toggle type="button">Logout</button></nav>
      </header>
      <main class="section">
        <div class="section-head"><div><h1>Products</h1><p>Add and remove products students can request.</p></div></div>
        <div id="accessMessage" class="status error"></div>
        <section id="productContent" class="hidden-admin">
          <div class="card panel">
            <h2>Add product</h2>
            <form id="productForm" class="form-grid">
              <div class="inline-grid"><label>Product name<input name="name" required placeholder="Example: A4 black-and-white print" /></label><label>Category<input name="category" required placeholder="Example: Printing" /></label></div>
              <div class="inline-grid"><label>Price in pesos<input name="price" type="number" min="0" step="0.01" required /></label><label>Available quantity<input name="stock" type="number" min="0" required /></label></div>
              <label>Image URL<input name="image" type="url" placeholder="Optional image URL" /></label>
              <button class="btn" type="submit">Add product</button>
            </form>
            <div id="productMessage" class="status"></div>
          </div>
          <div class="card admin-panel"><h2>Available products</h2><div id="productList" class="admin-actions"></div></div>
        </section>
      </main>
    </div>
  </body>
</html>
